{% extends "base.html" %}
{% block title %}Login — CareerAI{% endblock %}
{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-0 shadow-lg auth-card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="auth-icon mb-3"><i class="bi bi-cpu-fill text-primary fs-1"></i></div>
              <h2 class="fw-bold">Welcome Back</h2>
              <p class="text-muted">Sign in to view your career recommendations</p>
            </div>

            <div id="loginAlert" class="alert d-none"></div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope-fill text-muted"></i></span>
                <input type="email" id="loginEmail" class="form-control form-control-lg" placeholder="you@example.com" />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" id="loginPassword" class="form-control form-control-lg" placeholder="••••••••" />
              </div>
            </div>

            <button id="loginBtn" class="btn btn-primary btn-lg w-100 fw-bold" onclick="doLogin()">
              <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
              Sign In
            </button>

            <hr class="my-4" />
            <p class="text-center text-muted mb-0">
              Don't have an account? <a href="/register" class="text-primary fw-semibold">Create one free</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  const spinner  = document.getElementById('loginSpinner');
  const alert    = document.getElementById('loginAlert');

  if (!email || !password) { showAlert(alert,'danger','Please fill in all fields.'); return; }

  btn.disabled = true; spinner.classList.remove('d-none');

  const res  = await fetch('/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  btn.disabled = false; spinner.classList.add('d-none');

  if (res.ok) { window.location.href = '/dashboard'; }
  else { showAlert(alert,'danger', data.error || 'Login failed.'); }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
{% endblock %}
